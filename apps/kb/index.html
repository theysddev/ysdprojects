а","HR-директор","#B43E66"],ds:["Дмитрий Соколов","Системный администратор","#8F5A0E"],rg:["Ринат Галимов","Инженер по безопасности","#6B4F2A"],ng:["Наталья Глебова","Руководитель отдела продаж","#2C5FBF"],km:["Кирилл Мартынов","Руководитель поддержки","#7A4BC2"],eb:["Елена Борисова","Главный бухгалтер","#58655F"],ae:["Антон Ершов","Менеджер по продажам","#1F6F8B"],iv:["Игорь Валеев","Технический директор","#3D5A80"],mt:["Мария Тихонова","Специалист поддержки","#8E4E9E"],vm:["Вера Миронова","Специалист поддержки","#16614B"]},x="vm",E=t=>{const e=k[t]||k.vm;return{n:e[0],r:e[1],c:e[2],s:e[0].split(" ").map((t=>t[0])).join("")}},L=(t,e)=>{const n=E(t);return`<span class="av ${e||""}" style="--c:${n.c}" aria-hidden="true">${n.s}</span>`},T=[["welcome","onb","Добро пожаловать в «Сменщик»","ok","2026-10-01","«Сменщик» — облачный сервис графиков смен и учёта рабочего времени для кафе, магазинов и клиник. С 2016 года мы выросли из команды в пять человек в компанию на 120 сотрудников: офис в Казани и удалённые коллеги в 19 городах. Сервисом пользуются 4 200 компаний — от кофейни на шесть бариста до сети из 80 аптек.\n## Что мы ценим\n- **Ясность.** Пишем так, чтобы поняли с первого раза, и договариваемся письменно.\n- **Ответственность.** Взял задачу — довёл до результата или честно сказал, что не успеваешь.\n- **Забота о клиенте.** За каждым графиком смен — живые люди, которые хотят вовремя уйти домой.\n## Как устроена компания\nПять направлений: продукт и разработка, продажи, поддержка, маркетинг и общий отдел — HR, финансы и IT. Руководители и контакты — в статье [Кто есть кто](team).\n## С чего начать\n1. Откройте раздел [Мой онбординг](onboarding) — там чек-лист на первый месяц.\n2. Прочитайте [Первая неделя: план по дням](first-week).\n3. Настройте доступы по инструкции [Рабочие инструменты и доступы](tools).\n> Вопросы, на которые не нашли ответ в Справочной, задавайте в канале #новички — там отвечают в течение часа."],["first-week","onb","Первая неделя: план по дням","ok","2026-09-22","Первая неделя нужна, чтобы освоиться, а не чтобы сразу закрывать задачи. План ниже — ориентир: наставник подстроит его под вашу команду.\n## Понедельник\n- Встреча с HR в 10:00: документы, пропуск, ноутбук.\n- Настройка VPN и двухфакторной аутентификации.\n- Знакомство с наставником и командой.\n## Вторник и среда\n- Вводный курс по продукту — 2 часа в обучающей платформе.\n- Регламенты своего отдела.\n- Тестовый аккаунт «Сменщика»: составьте график на неделю для вымышленной кофейни.\n## Четверг\nРабота в паре с наставником: смотрите, как он решает реальные задачи, и задавайте вопросы — глупых вопросов в первую неделю не бывает.\n## Пятница\n- Встреча 1:1 с руководителем: что получилось, что непонятно, цели на месяц.\n- Короткий отзыв о первой неделе — форма придёт в мессенджер.\n> Если что-то пошло не по плану — это нормально. Напишите наставнику, он поможет перестроить расписание."],["team","onb","Кто есть кто: структура и контакты","ok","2026-08-18","В компании 120 человек и пять направлений. Если не знаете, к кому идти с вопросом, начните с руководителя направления или с канала #новички.\n## Направления\n| Направление | Руководитель | Людей |\n| Продукт и разработка | Игорь Валеев | 48 |\n| Продажи | Наталья Глебова | 22 |\n| Поддержка клиентов | Кирилл Мартынов | 26 |\n| Маркетинг | Анна Шестакова | 9 |\n| HR, финансы и IT | Юлия Карпова | 15 |\n## К кому с каким вопросом\n- Отпуск, больничный, справки — HR, Юлия Карпова.\n- Ноутбук, доступы, VPN — IT, канал #it-помощь.\n- Командировки и авансовые отчёты — бухгалтерия, Елена Борисова.\n- Вопросы по продукту — наставник или канал #продукт.\n## Ритм компании\nКаждый понедельник в 11:00 — общий созвон на 20 минут. Раз в квартал — встреча всей компании в Казани, дорогу и проживание оплачивает компания."],["tools","onb","Рабочие инструменты и доступы","ds","2026-09-30","В первый день вы получаете ноутбук с установленными программами и учётную запись. Временный пароль придёт в SMS — смените его при первом входе.\n## Что у вас будет\n- **Почта и календарь** — встречи назначаем только через календарь.\n- **Мессенджер** — рабочее общение, каналы отделов и #новички.\n- **Трекер задач** — задачи разработки, продаж и поддержки.\n- **Портал сотрудника** — отпуска, больничные, справки и расчётные листы.\n- **Хелпдеск** — обращения клиентов, нужен поддержке и аккаунт-менеджерам.\n## Как получить доступ\nБазовые доступы выдаются автоматически. Доступ к хелпдеску, CRM или админке продукта запрашивайте по инструкции [Как запросить доступ к системе](access).\n## Первые настройки\n[x] Сменить временный пароль\n[ ] Включить двухфакторную аутентификацию\n[ ] Настроить VPN\n[ ] Загрузить фото в профиль мессенджера\n!> Не устанавливайте на рабочий ноутбук программы из непроверенных источников. Нужна программа — напишите в #it-помощь."],["remote","onb","Правила удалённой работы","ok","2026-07-07","Около половины команды работает удалённо. Чтобы всем было удобно, мы договорились о нескольких правилах.\n## Рабочее время\nОсновное время — с 10:00 до 17:00 по Москве: в эти часы мы на связи и проводим встречи. Остальное время распределяйте сами.\n## Связь\n- Статус в мессенджере отражает реальность: «на встрече», «не беспокоить», «в отпуске».\n- На сообщения отвечаем в течение 2 часов в рабочее время.\n- Камера на встречах — по желанию, но на 1:1 лучше включить.\n## Рабочее место\nКомпания компенсирует технику для дома — подробности в статье [ДМС и компенсации](dms).\n> Если чувствуете, что выпали из команды, — скажите наставнику или руководителю. Устроим встречу в офисе или созвон с командой."],["call-script","sales","Скрипт первого звонка","ng","2026-09-15","Цель первого звонка — не продать, а понять, подходит ли клиенту «Сменщик», и договориться о демонстрации. Звонок занимает 10–15 минут.\n## Структура звонка\n1. **Знакомство.** Назовите себя и компанию, уточните, удобно ли говорить.\n2. **Контекст.** «Вы оставили заявку на сайте — расскажите, как сейчас составляете графики?»\n3. **Вопросы.** Сколько сотрудников и точек, кто составляет график, сколько времени уходит, как считаете переработки.\n4. **Ценность.** Свяжите боль клиента с функцией: «Вы тратите полдня на график — в „Сменщике“ шаблон заполняется за 10 минут».\n5. **Следующий шаг.** Демонстрация на 30 минут в ближайшие 3 дня — назначьте время сразу.\n## Чего избегать\n- Не перечисляйте все функции подряд — говорите о том, что болит у клиента.\n- Не называйте скидку на первом звонке.\n- Не заканчивайте звонок без договорённости о следующем шаге.\n> После звонка в течение часа заполните карточку сделки в CRM: число сотрудников, точек, текущий способ и дату демонстрации."],["pricing","sales","Тарифы и правила скидок","ng","2026-10-07","Цены указаны за месяц при помесячной оплате. При оплате за год — скидка 15%, она не суммируется с другими скидками.\n| Тариф | Сотрудников | Цена в месяц |\n| Старт | до 15 | 990 ₽ |\n| Бизнес | до 60 | 2 900 ₽ |\n| Сеть | до 250 | 7 900 ₽ |\n| Корпоративный | от 250 | индивидуально |\n## Кто согласует скидку\n- До 10% — менеджер сам, без согласования.\n- От 10 до 20% — руководитель отдела продаж.\n- Больше 20% — коммерческий директор, только для сетей от 50 точек.\n## Пробный период\n14 дней бесплатно на тарифе «Бизнес». Продлить до 30 дней можно один раз, если клиент активно пользуется сервисом.\n!> Не обещайте клиенту цену, которой нет в прайсе, до согласования. Письменное обещание — уже обязательство компании."],["proposal","sales","Как оформить коммерческое предложение","ae","2026-08-27","КП готовим после демонстрации, когда понятны число сотрудников, точек и нужные модули. Шаблон — в CRM, раздел «Документы».\n## Порядок\n1. Создайте КП из карточки сделки — реквизиты клиента подставятся автоматически.\n2. Выберите тариф и модули, укажите срок оплаты.\n3. Если нужна скидка больше 10% — отправьте на согласование руководителю.\n4. Отправьте КП письмом и продублируйте в мессенджер клиента.\n5. Через 2 рабочих дня позвоните и уточните вопросы.\n## Что должно быть в КП\n- Расчёт стоимости на год с учётом скидки.\n- Сроки внедрения: обычно 3–5 рабочих дней.\n- Контакт персонального менеджера.\n- Срок действия предложения — 14 дней.\n> Хорошее КП помещается на одну страницу. Подробности о функциях лучше показать на демонстрации, чем расписывать в документе."],["objections","sales","Работа с возражениями","ng","2026-06-30","Возражение — это вопрос, на который клиент пока не получил ответа. Сначала уточните, что стоит за словами, и только потом отвечайте.\n## «Дорого»\nУточните, с чем сравнивает клиент. Посчитайте вместе: управляющий тратит 6 часов в неделю на график — это больше 20 часов в месяц. Тариф «Бизнес» стоит меньше одного рабочего дня управляющего.\n## «Ведём графики в таблицах, всё устраивает»\nСпросите, как сейчас учитываются переработки и подмены. Обычно именно там теряются деньги и возникают споры с сотрудниками.\n## «Сотрудники не будут пользоваться приложением»\nРасскажите, что смены приходят в мессенджер, а приложение не обязательно. Предложите пилот на одной точке на 14 дней.\n## «Нам нужно подумать»\nСпросите, что именно нужно обдумать и кто ещё участвует в решении. Договоритесь о конкретной дате следующего звонка."],["handover","sales","Передача клиента в поддержку после оплаты","ng","2026-09-03","После оплаты клиент переходит к команде внедрения. Хорошая передача экономит клиенту время: ему не придётся рассказывать всё заново.\n## Чек-лист передачи\n[ ] Оплата подтверждена в CRM\n[ ] В карточке указаны число сотрудников и точек\n[ ] Записаны договорённости: скидка, сроки, особые условия\n[ ] Назначена вводная встреча с менеджером внедрения\n[ ] Клиент получил письмо с контактами поддержки\n## Как передать\nПереведите сделку на этап «Внедрение» — задача менеджеру внедрения создастся автоматически. Если у клиента больше 10 точек, проведите передачу голосом: 15-минутный созвон втроём.\n> Первые 30 дней вы остаётесь на связи: с вопросами о договоре и оплате клиент пишет вам, а не в поддержку."],["sla","sup","Регламент ответа клиенту","km","2026-10-01","Первая линия отвечает клиентам в чате, по почте и по телефону ежедневно с 8:00 до 22:00 по Москве. Сбои с приоритетом P1 обрабатываем круглосуточно.\n## Сроки первого ответа\n| Канал | Первый ответ | Решение |\n| Чат в приложении | до 15 минут | в тот же день |\n| Почта | до 4 часов | до 2 рабочих дней |\n| Телефон | сразу, ожидание до 2 минут | в тот же день |\n| Сбой P1 | до 30 минут, круглосуточно | по плану инцидента |\n## Как отвечать\n1. Поздоровайтесь по имени и представьтесь.\n2. Если вопрос неясен, уточните суть — одним сообщением, а не пятью.\n3. Дайте ответ или срок, к которому он будет.\n4. Убедитесь, что вопрос решён, и закройте обращение.\n!> Не успеваете в срок — напишите клиенту, что вопрос в работе, и назовите новый срок. Молчание хуже задержки.\n> Готовые формулировки — в статье [Тон и шаблоны ответов](tone)."],["escalation","sup","Эскалация на вторую линию","km","2026-09-09","Вторая линия — инженеры поддержки. Они разбирают ошибки, проблемы с интеграциями и данными. Эскалируйте, если вопрос не решается по базе знаний за 20 минут.\n## Когда эскалировать\n- Ошибка воспроизводится в вашем тестовом аккаунте.\n- Пропали или задвоились данные: смены, отметки, табель.\n- Не работает интеграция с кассой или кадровой системой.\n- Клиент сообщает о сбое, который затрагивает больше одной компании.\n## Как оформить\nСоздайте задачу в хелпдеске с типом «Вторая линия» и заполните:\n- номер аккаунта и тариф;\n- шаги, чтобы воспроизвести ошибку;\n- что ожидали и что получили;\n- скриншоты или запись экрана.\n> Клиенту напишите, что вопрос передан инженерам, и назовите срок ответа: обычно до 4 рабочих часов."],["tone","sup","Тон и шаблоны ответов","mt","2026-08-12","Мы пишем клиентам как коллеги, которые хотят помочь: на «вы», просто и по делу. Без канцелярита и без смайликов в первых сообщениях.\n## Принципы\n- Начинайте с ответа, а не с благодарности за обращение.\n- Одно сообщение — одна мысль. Длинную инструкцию разбейте на шаги.\n- Не обвиняйте клиента: не «вы неправильно настроили», а «давайте проверим настройку».\n## Примеры\n| Вместо | Пишем |\n| Ваше обращение принято в работу | Разбираюсь, отвечу до 15:00 |\n| Данная функция не предусмотрена | Так сервис пока не умеет, но есть способ обойти |\n| Обратитесь в техподдержку | Передал инженерам, они напишут вам сегодня |\n## Шаблоны\nГотовые ответы на частые вопросы — в хелпдеске, раздел «Макросы». Перед отправкой подставьте имя клиента и проверьте детали."],["refund","sup","Возврат средств и перенос оплаты","km","2026-07-21","Возврат делаем, если клиент отказался от сервиса в течение 14 дней после оплаты или если ошибка была на нашей стороне.\n## Порядок\n1. Уточните причину отказа и зафиксируйте её в карточке клиента.\n2. Предложите альтернативу: перенос оплаты, смену тарифа или паузу до 30 дней.\n3. Если клиент настаивает — создайте заявку «Возврат» в хелпдеске.\n4. Финансовый отдел проверяет заявку в течение 2 рабочих дней.\n5. Деньги возвращаются на карту или счёт за 5–10 рабочих дней.\n## Перенос оплаты\nСдвинуть дату списания на срок до 14 дней можно без согласования. На больший срок — с руководителем поддержки.\n!> Не обещайте возврат до проверки финансовым отделом. Пишите: «Заявку передал, ответ будет до пятницы»."],["incident","sup","Как вести инцидент при сбое сервиса","km","2026-05-19","Инцидент — ситуация, когда сервис недоступен или работает с ошибками у многих клиентов. Главное правило: один ответственный и регулярные обновления.\n## Приоритеты\n- **P1** — сервис недоступен или теряются данные. Реакция до 30 минут, круглосуточно.\n- **P2** — не работает важная функция у части клиентов. Реакция до 2 часов.\n- **P3** — неудобство, у которого есть обходной путь. В обычной очереди.\n## Что делать первой линии при P1\n1. Сообщить дежурному инженеру в канал #инциденты.\n2. Включить баннер о сбое в приложении — шаблон в хелпдеске.\n3. Отвечать клиентам единым текстом и обновлять его каждые 30 минут.\n4. После решения — написать всем, кто обращался.\n> После каждого P1 в течение 3 рабочих дней проводим разбор: что случилось, почему и что меняем."],["vacation","hr","Как оформить отпуск","yk","2026-10-03","Ежегодный оплачиваемый отпуск — 28 календарных дней. Его можно делить на части, но одна из частей должна быть не меньше 14 дней.\n## Когда подавать заявление\nНе позднее чем за 14 календарных дней до начала отпуска. График отпусков на следующий год собираем в декабре — постарайтесь заранее согласовать даты с командой.\n## Как подать заявку\n1. Согласуйте даты с руководителем и предупредите команду.\n2. Откройте «Портал сотрудника» → «Отпуска» → «Новое заявление».\n3. Укажите даты и того, кто вас заменяет.\n4. Заявление уйдёт руководителю, затем в HR. Статус видно на портале.\n## Отпускные\nВыплачиваются не позднее чем за 3 дня до начала отпуска. Расчётный лист появится на портале.\n## Перед отпуском\n[ ] Передать текущие задачи заместителю\n[ ] Поставить автоответ в почте\n[ ] Отметить отпуск в календаре\n> Перенести или отменить отпуск можно через то же заявление на портале, но не позже чем за 3 дня до начала."],["sick","hr","Больничный: что делать","yk","2026-04-14","Если заболели — не выходите на работу, даже удалённо. Здоровье важнее задач, а команда справится.\n## В первый день\n1. До 10:00 напишите руководителю и в HR, что заболели.\n2. Обратитесь к врачу и оформите электронный больничный.\n3. Отправьте номер больничного в HR через «Портал сотрудника».\n## После выздоровления\nСообщите руководителю дату выхода и закройте больничный у врача. Пособие начисляется вместе с ближайшей зарплатой.\n## Если заболел ребёнок\nБольничный по уходу за ребёнком оформляется так же: номер — в HR, предупредить руководителя.\n> Чувствуете себя плохо, но не настолько, чтобы брать больничный? Договоритесь с руководителем о дне без задач — так тоже можно."],["dms","hr","ДМС и компенсации","yk","2026-09-01","Полис ДМС оформляется после испытательного срока — через 3 месяца работы. Он покрывает поликлинику, стоматологию, вызов врача на дом и экстренную госпитализацию.\n## Компенсации\n| Что | Сколько | Как получить |\n| Спорт | до 3 000 ₽ в месяц | чек через портал |\n| Обучение | до 30 000 ₽ в год | согласовать с руководителем |\n| Техника для удалённой работы | 15 000 ₽ раз в 2 года | чек через портал |\n| Психолог | 4 сессии в год | по программе ДМС |\n## Как вернуть деньги\nЗагрузите чек на «Портале сотрудника» в разделе «Компенсации» до 25 числа — сумма придёт с зарплатой следующего месяца.\n> Добавить в ДМС супруга или ребёнка можно за свой счёт по корпоративной цене — напишите в HR."],["trips","hr","Командировки и авансовые отчёты","eb","2026-06-09","Командировку согласует руководитель, билеты и гостиницу бронирует офис-менеджер. Покупать билеты самостоятельно не нужно.\n## Как оформить\n1. Создайте заявку на «Портале сотрудника» минимум за 5 рабочих дней.\n2. Укажите цель, даты и город.\n3. После согласования получите билеты и бронь на почту.\n## Суточные\n700 ₽ в день по России. Выплачиваются авансом вместе с подтверждением командировки.\n## Авансовый отчёт\nСдайте в течение 3 рабочих дней после возвращения. Приложите:\n- посадочные талоны или электронные билеты;\n- чеки за такси и проживание, если оплачивали сами;\n- итоги поездки в двух-трёх предложениях.\n!> Без чеков расходы не компенсируются. Фото чека в хорошем качестве подойдёт."],["review","hr","Оценка эффективности и пересмотр зарплаты","yk","2026-09-24","Оценка проходит два раза в год — в апреле и октябре. Её задача — договориться о целях и честно поговорить о росте, а не выставить оценку.\n## Этапы\n1. **Самооценка** — неделя на форму: результаты, сложности, чему хотите научиться.\n2. **Обратная связь коллег** — 2–3 человека, которых вы выбираете вместе с руководителем.\n3. **Встреча 1:1** — обсуждение итогов и целей на полгода.\n4. **Калибровка** — руководители сверяют оценки, чтобы подход был одинаковым.\n## Пересмотр зарплаты\nПо итогам оценки руководитель может предложить повышение. Решение сообщается в течение месяца после встречи и действует с 1 числа следующего месяца.\n> Если вы работаете меньше 3 месяцев, в оценке не участвуете — вместо неё будет встреча по итогам испытательного срока."],["vpn","it","Настройка VPN","ds","2026-10-09","VPN нужен для доступа к хелпдеску, админке продукта и внутренним документам вне офиса. В офисе подключение не требуется.\n## Установка\n1. Откройте «Портал сотрудника» → «IT» → «VPN» и скачайте клиент для своей системы.\n2. Нажмите «Получить конфигурацию» — файл действует 12 месяцев.\n3. Откройте клиент, выберите «Импорт» и укажите скачанный файл.\n4. Включите подключение и войдите с учётной записью и кодом двухфакторной аутентификации.\n## Проверка\nОткройте `helpdesk.smenshik.internal` — если страница загрузилась, VPN работает.\n## Если не подключается\n- Проверьте, что время на ноутбуке устанавливается автоматически.\n- Отключите другие VPN и прокси.\n- Перезапустите клиент и повторите вход.\n!> Не передавайте файл конфигурации коллегам — он привязан к вашей учётной записи. При потере ноутбука сразу сообщите в IT."],["passwords","it","Пароли и двухфакторная аутентификация","rg","2026-08-04","Учётная запись открывает доступ к данным клиентов, поэтому защищаем её двумя факторами: паролем и кодом из приложения.\n## Требования к паролю\n- Не короче 12 символов. Удобнее всего — фраза из трёх-четырёх слов.\n- Не используйте один пароль для разных сервисов.\n- Храните пароли в корпоративном менеджере паролей, а не в браузере или заметках.\n## Как включить двухфакторную аутентификацию\n1. Установите на телефон любое приложение-аутентификатор.\n2. Откройте «Портал сотрудника» → «Безопасность» → «Двухфакторная аутентификация».\n3. Отсканируйте QR-код и введите шестизначный код.\n4. Сохраните резервные коды в менеджере паролей.\n> Сменили телефон? Перенесите аутентификатор до сброса старого или напишите в #it-помощь — восстановим доступ после проверки личности."],["phishing","it","Что делать при фишинговом письме","rg","2026-09-17","Фишинг — письмо или сообщение, которое пытается выманить пароль, код или заставить открыть вредоносный файл. Злоумышленники часто притворяются руководителями, банком или клиентами.\n## Признаки\n- Срочность: «оплатите сегодня», «доступ заблокируют через час».\n- Адрес отправителя похож на настоящий, но отличается одной буквой.\n- Просьба ввести пароль или код по ссылке из письма.\n- Неожиданный архив или документ с макросами.\n## Что делать\n1. Не переходите по ссылкам и не открывайте вложения.\n2. Нажмите в почте кнопку «Сообщить о фишинге» или перешлите письмо в канал #безопасность.\n3. Удалите письмо.\n!> Если вы уже ввели пароль — сразу смените его и напишите в #безопасность. Чем быстрее мы узнаем, тем меньше вреда. Наказывать за ошибку никто не будет."],["access","it","Как запросить доступ к системе","ds","2026-07-28","Доступы выдаём по принципу минимальных прав: только то, что нужно для работы. Так меньше риск утечки и проще разбираться в инцидентах.\n## Как запросить\n1. Откройте «Портал сотрудника» → «IT» → «Запрос доступа».\n2. Выберите систему и уровень: чтение, редактирование или администрирование.\n3. Одной фразой опишите, зачем нужен доступ.\n4. Заявку согласует ваш руководитель, затем владелец системы.\n## Сроки\nОбычный доступ выдаётся за 1 рабочий день. Административный — до 3 рабочих дней и только после инструктажа по безопасности.\n## Временный доступ\nДля разовых задач запрашивайте доступ на срок — он отключится автоматически.\n> Когда вы меняете отдел или роль, ненужные доступы отзываются. Это не недоверие, а обычная гигиена."],["pd","it","Работа с персональными данными клиентов","rg","2026-05-26","В «Сменщике» хранятся данные сотрудников наших клиентов: имена, телефоны, графики и отработанные часы. Это персональные данные, и мы отвечаем за них по закону.\n## Можно\n- Открывать данные клиента, только когда это нужно для решения его вопроса.\n- Передавать данные внутри компании через хелпдеск и трекер.\n## Нельзя\n- Выгружать данные клиентов на личные устройства и в личные облака.\n- Пересылать таблицы с данными в мессенджерах и по почте за пределы компании.\n- Делать скриншоты с персональными данными для презентаций — используйте демо-аккаунт.\n## Если данные утекли\nНемедленно сообщите в #безопасность и руководителю. Мы обязаны оценить ситуацию в течение 24 часов.\n!> Нарушение правил работы с персональными данными — повод для дисциплинарного взыскания."],["lost-device","it","Потеря ноутбука или телефона","ds","2026-06-23","Если рабочий ноутбук или телефон с рабочими приложениями потерян или украден, действуйте быстро: каждый час даёт злоумышленнику время.\n## Сразу\n1. Позвоните на дежурный номер IT — он закреплён в канале #it-помощь и работает круглосуточно.\n2. Смените пароль учётной записи с другого устройства.\n3. Сообщите руководителю.\n## Что сделает IT\n- Заблокирует устройство и активные сессии.\n- Отзовёт конфигурацию VPN.\n- При возможности удалённо сотрёт данные.\n## Дальше\nЕсли устройство украдено, подайте заявление в полицию — копия нужна для страховой. Новый ноутбук выдадим в течение 2 рабочих дней.\n> Диски всех рабочих ноутбуков зашифрованы, поэтому при быстром сообщении данные остаются в безопасности."]],w={welcome:[["ok","Обновлены цифры: 120 сотрудников, 4 200 клиентов",[["компанию на 120 сотрудников","компанию на 95 сотрудников"],["в 19 городах","в 14 городах"],["4 200 компаний","3 600 компаний"]]],["2026-03-02","ok","Статья создана"]],vacation:[["yk","Добавлен чек-лист «Перед отпуском»",[["\n## Перед отпуском\n[ ] Передать текущие задачи заместителю\n[ ] Поставить автоответ в почте\n[ ] Отметить отпуск в календаре",""]]],["2026-08-12","yk","Срок подачи — 14 календарных дней",[["Не позднее чем за 14 календарных дней до начала отпуска.","За две недели до начала отпуска."],["не позднее чем за 3 дня","за 3 дня"]]],["2026-03-15","ok","Статья создана"]],sla:[["km","Чат: первый ответ за 15 минут вместо 30",[["| Чат в приложении | до 15 минут","| Чат в приложении | д
